stages:
  chunk:
    cmd: python -m rag.chunk
    deps:
      - rag/chunk.py
      - pipeline/config.py
      - docs/gmail_pytest_suite.py
      - .env
    outs:
      - data/chunks/chunks.jsonl

  index:
    cmd: python -m rag.embedding
    deps:
      - rag/embedding.py
      - pipeline/config.py
      - data/chunks/chunks.jsonl
      - .env
    outs:
      - data/faiss/language_chunks_index.faiss
      - data/faiss/language_chunks_index.pkl

  generate:
    cmd: python -m rag.generate
    deps:
      - rag/generate.py
      - pipeline/config.py
      - data/faiss/language_chunks_index.faiss
      - data/faiss/language_chunks_index.pkl
      - .env
    outs:
      - data/generated:
          persist: true
      - data/eval/traces:
          persist: true

  evaluate:
    cmd: python -m rag.evaluate --latest
    deps:
      - rag/evaluate.py
      - pipeline/config.py
      - data/eval/traces
      - .env
    metrics:
      - data/eval/reports/report_context_precision.json:
          cache: false

